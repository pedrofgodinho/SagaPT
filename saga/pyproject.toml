[project]
name = "thesis"
version = "0.1.0"
dependencies = [
    "langgraph",
    "langchain-google-genai",
    "zaproxy",
    "pydantic-settings",
    "python-dotenv",
    "grandalf>=0.8",
    "rich>=14.3.3",
    "requests>=2.32.5",
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.42.0",
    "sse-starlette>=3.3.3",
    "pyyaml>=6.0.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
